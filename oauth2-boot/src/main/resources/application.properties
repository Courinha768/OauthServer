spring.application.name=oauth2-core

# Which persistence adapter to activate: inmemory or file.
oauth2.persistence.repository=inmemory
oauth2.file.persistence.clients-file-path=${OAUTH2_CLIENTS_FILE_PATH:./data/clients.json}
oauth2.file.persistence.access-tokens-file-path=${OAUTH2_ACCESS_TOKENS_FILE_PATH:./data/access-tokens.json}
# Only consulted when oauth2.persistence.repository=file, and only when the clients file is
# empty. Off by default: the file is the operator's source of truth, so writing demo clients
# with known secrets into it should be something you ask for.
oauth2.file.persistence.seed-demo-clients=false

# Which AccessTokenGenerator adapter to activate: opaque or jwt.
oauth2.token.format=opaque

# Lifetime of an issued access token, as an ISO-8601 duration.
oauth2.token.access-token-ttl=PT1H

# Used only when oauth2.token.format=jwt.
oauth2.jwt.issuer=https://localhost:8080
# Development default only; supply OAUTH2_JWT_SECRET in any real deployment.
# Must be at least 256 bits, which the JwtCodec enforces at startup.
oauth2.jwt.hmac-secret=${OAUTH2_JWT_SECRET:dev-only-insecure-secret-change-me-32b}

# Uncomment to see the wire traffic while exercising the endpoint.
#logging.level.org.springframework.web=DEBUG
